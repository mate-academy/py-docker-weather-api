name: Test

on:
  push:
    branches:
      - "develop"
  pull_request:
    branches:
      - "master"
      - "develop"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set Up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 app/

      - name: Test weather client
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t weather-api:test .

      - name: Check container startup and missing-key handling
        run: |
          set +e
          output=$(docker run --rm weather-api:test 2>&1)
          status=$?
          set -e
          test "$status" -eq 1
          test "$output" = "Error: Set the API_KEY environment variable."

